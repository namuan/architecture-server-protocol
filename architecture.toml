[project]
name = "architecture-server-protocol"
languages = ["rust"]
version = "1"

[[component]]
name = "asp-cli"
paths = ["crates/asp-cli/**"]

[[component]]
name = "asp-core"
paths = ["crates/asp-core/**"]

[[component]]
name = "asp-daemon"
paths = ["crates/asp-daemon/**"]

[[component]]
name = "asp-db"
paths = ["crates/asp-db/**"]

[[component]]
name = "asp-llm"
paths = ["crates/asp-llm/**"]

[[component]]
name = "asp-parser"
paths = ["crates/asp-parser/**"]

[[component]]
name = "asp-rules"
paths = ["crates/asp-rules/**"]

[[component]]
name = "asp-watcher"
paths = ["crates/asp-watcher/**"]

[[rule]]
name = "no_cycles"
type = "no_cycles"

[[rule]]
name = "no_unowned"
type = "no_unowned"
